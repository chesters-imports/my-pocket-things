<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Pocket Notebook · CO.MYPT-002-NOTES</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Special+Elite&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body class="pn">
  <header class="pn-chrome" data-deck-chrome>
    <span class="pn-chip" data-deck-menu title="Menu">MY<strong>POCKET</strong></span>
    <span class="pn-drag" data-deck-drag title="drag">notebook · CO.MYPT-002-NOTES</span>
    <div class="pn-win" data-deck-window-controls aria-label="Window"></div>
  </header>

  <div class="pn-stage" id="stage">
    <!-- shelf or open book -->
  </div>

  <footer class="pn-bar" aria-label="Keys">
    <span class="pn-hint" id="hint">shelf · open a book</span>
    <span class="pn-keys mono" id="keys"></span>
  </footer>

  <div class="pn-toast" id="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
