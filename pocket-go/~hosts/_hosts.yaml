# optional. folders under ~hosts still become go.{name} with no line here.
#
# alias a folder whose disk name is not the go.* name:
# dir:
#   folder: THE-DIR
#   title: THE DIR
#
# connect an exterior markdown folder as roam.{slug}:
# drop:
#   kind: roam
#   source: C:\Users\you\Desktop\roam-drop
#   title: roam drop
#
# kind: go + source: is still a go door (a code bay whose files live elsewhere).
#
# bar: extra jump-bar words for this room (comma or space).
# The folder name already works (type `codes`, `tags`, `detective`).
# start, go, roam, and recent are built-in lobbies.
#
# title a room that already exists as ~hosts/terminal:
# terminal:
#   title: terminal

# pin favorites to the top of {{doors}} (lower number = higher):
# kmoire:
#   pin: 1

